daemon off;
pid /tmp/hievents-nginx/nginx.pid;
error_log stderr;

events {}

http {
    access_log off;
    client_body_temp_path /tmp/hievents-nginx/body;
    proxy_temp_path /tmp/hievents-nginx/proxy;
    fastcgi_temp_path /tmp/hievents-nginx/fastcgi;
    uwsgi_temp_path /tmp/hievents-nginx/uwsgi;
    scgi_temp_path /tmp/hievents-nginx/scgi;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 127.0.0.1:__PORT__;
        client_max_body_size 20M;

        location / {
            proxy_pass http://127.0.0.1:5678;
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
